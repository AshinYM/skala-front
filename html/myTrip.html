<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>나의 여행 앨범</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <h1>🌍 나의 여행 앨범</h1>

    <p>
        지금까지 여행했던 장소의 경관을 찍은 사진입니다.
    </p>

    <hr>

    <!-- 여행 음악 -->
    <h2>🎵 여행하면서 듣는 음악</h2>

    <audio controls>
        <source src="../media/music.mp3" type="audio/mpeg">
        브라우저가 오디오를 지원하지 않습니다.
    </audio>

    <hr>

    <!-- 여행 사진 -->
    <h2>📸 여행 사진</h2>

    <figure>
        <img src="../media/리장.jpg" width="450" alt="리장">
        <figcaption>🏔️ 중국 리장 (2025)</figcaption>
    </figure>

    <br>

    <figure>
        <img src="../media/세부.jpg" width="450" alt="세부">
        <figcaption>🌴 필리핀 세부 (2024)</figcaption>
    </figure>

    <br>

    <figure>
        <img src="../media/홋카이도.jpg" width="450" alt="홋카이도">
        <figcaption>❄️ 일본 홋카이도 (2025)</figcaption>
    </figure>

    <hr>

    <!-- 여행 영상 -->
    <h2>🎥 기억에 남는 공연</h2>

    <video controls width="450">
        <source src="../media/video.mp4" type="video/mp4">
        브라우저가 비디오를 지원하지 않습니다.
    </video>

    <hr>

    <!-- 여행 버킷리스트 -->
    <h2>🧳 앞으로 가보고 싶은 여행지</h2>

    <ul>
        <li>🇨🇭 스위스</li>
        <li>🇮🇸 아이슬란드</li>
        <li>🇳🇴 노르웨이</li>
        <li>🇨🇦 캐나다</li>
    </ul>

    <hr>

    <blockquote>
        <strong>
            "여행은 새로운 세상을 경험하고 나를 성장시키는 가장 재밌는 방법이다."
        </strong>
    </blockquote>

    <p>
        😊 다음 여행도 즐겁고 소중한 추억이 되길 바라며.
    </p>

</body>

</html>
